name: lx_music_flutter
description: "LX Music Flutter - A music player app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Audio
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  permission_handler: ^11.0.1

  # Navigation
  go_router: ^13.0.0

  # Network
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  http: ^1.2.0
  webdav_client: ^1.2.2

  # Crypto
  pointycastle: ^3.7.3
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Utils
  path_provider: ^2.1.1
  uuid: ^4.2.1
  intl: ^0.19.0
  rxdart: ^0.27.7
  file_picker: ^8.0.0

  # JavaScript Engine
  flutter_js: ^0.8.7

  # UI
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Lyrics

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

  # Analysis
  analyzer: ^6.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
